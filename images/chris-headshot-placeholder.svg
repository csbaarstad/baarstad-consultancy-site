      <stop offset="0%" stop-color="#e3e0c8"/>
      <stop offset="100%" stop-color="#d4d0b8"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/>
      <feColorMatrix values="0 0 0 0 0.3 0 0 0 0 0.25 0 0 0 0 0.15 0 0 0 0.08 0"/>
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
