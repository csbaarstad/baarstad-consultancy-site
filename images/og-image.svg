<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161410"/>
      <stop offset="100%" stop-color="#0e0d0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#d94e22" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d94e22" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="0%" r="40%">
      <stop offset="0%" stop-color="#5e9cff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5e9cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="none"/>
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ecead9" stroke-width="0.6" opacity="0.04"/>
    </pattern>
    <mask id="gridMask">
      <radialGradient id="gm" cx="50%" cy="50%" r="55%">
        <stop offset="0%" stop-color="#fff"/>
        <stop offset="100%" stop-color="#000"/>
      </radialGradient>
      <rect width="1200" height="630" fill="url(#gm)"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- registration marks -->
  <g fill="#76725f" opacity="0.6">
    <rect x="40" y="40" width="22" height="1.2"/><rect x="50" y="40" width="1.2" height="22"/>
    <rect x="1138" y="40" width="22" height="1.2"/><rect x="1148.8" y="40" width="1.2" height="22"/>
    <rect x="40" y="588.8" width="22" height="1.2"/><rect x="50" y="568" width="1.2" height="22"/>
    <rect x="1138" y="588.8" width="22" height="1.2"/><rect x="1148.8" y="568" width="1.2" height="22"/>
  </g>

  <!-- file tag style label -->
  <g transform="translate(100 110)">
    <rect x="0" y="0" width="280" height="38" rx="4" fill="none" stroke="#2e2a22" stroke-width="1"/>
    <circle cx="22" cy="19" r="5" fill="#d94e22"/>
    <text x="42" y="25" font-family="JetBrains Mono, monospace" font-size="13" fill="#b8b5a0" letter-spacing="2" font-weight="600">BAARSTAD CONSULTANCY</text>
  </g>

  <!-- main wordmark / tagline -->
  <text x="100" y="280" font-family="Archivo Black, sans-serif" font-size="100" fill="#ecead9" letter-spacing="-4">MULTI-DISCIPLINE</text>
  <text x="100" y="380" font-family="Archivo Black, sans-serif" font-size="100" fill="#d94e22" letter-spacing="-4">OPERATIONS</text>
  <text x="100" y="480" font-family="Archivo Black, sans-serif" font-size="100" fill="#ecead9" letter-spacing="-4">&amp; PRODUCT WORK.</text>

  <!-- sub footer -->
  <g transform="translate(100 552)">
    <text x="0" y="0" font-family="Inter Tight, sans-serif" font-size="20" fill="#b8b5a0" font-weight="500">Chris Baarstad · Events · EdTech · AI · People-Ops · Yorba Linda, CA</text>
  </g>

  <!-- accent bar bottom -->
  <rect x="100" y="510" width="80" height="3" fill="#d94e22"/>
</svg>
